---
# Local-only. Never uploaded — `trmnlp push` sends src/settings.yml, not this.

watch:
  - src
  - .trmnlp.yml

# The zone the board is rendered in. The Worker pins America/New_York itself,
# because a deployed Cloudflare Worker runs in UTC and would otherwise print
# every departure four or five hours out. This sets what `{{ trmnl.user }}`
# reports locally so the preview matches the device.
time_zone: America/New_York

# Test values for `trmnlp serve` — the same board the dashboard shows, so the
# preview can be compared against the real panel.
#
# Station values are what the picker stores, including the type prefix and, for
# the bus corner, the "@" stop name. Pick them by hand here; in the real form
# they come from the search dropdown.
#
# **These are not the values on the device.** They are a known-good board,
# typed by hand, so the preview renders a board at all. The device renders
# whatever the user picked in the TRMNL form — which means the one class of
# bug this preview structurally cannot show is a bad *stored* value. That is
# not hypothetical: a value saved before the picker returned {id, name}
# decayed into "Bus:6:", which parses as stop `6` and rendered a dead card
# on the device while every local screenshot stayed clean.
#
# `cardN_visible` is listed for the same reason. It was absent here, so the
# toggle had no value in the preview at all and went unexercised — which is
# why "the toggle does nothing" could only be found on hardware. Note the
# preview still cannot prove the toggle works: TRMNL interpolates it into
# the polling URL on their server, so what a checkbox actually stores as
# only exists there. That is why the Worker, not the template, decides.
custom_fields:
  # BEGIN generated by npm run preview:sync
  card1_visible: true
  card1_station: "subway:127+725+902+A27+R16"
  card1_walk: 5
  card1_title: "Times Sq-42 St"

  card2_visible: true
  card2_station: "subway:R16!N,Q,R,W"
  card2_walk: 5
  card2_title: "Times Sq N/Q/R/W"

  card3_visible: true
  card3_station: "railroad-lirr:102"
  card3_walk: 10
  card3_title: "Jamaica"

  card4_visible: true
  card4_station: "bus:403257+403465"
  card4_walk: 5
  card4_title: "W 42 St/5 Av"

  card5_visible: true
  card5_station: "railroad-mtn:1"
  card5_walk: 10
  card5_title: "Grand Central"

  card6_visible: true
  card6_station: "ferry:87"
  card6_walk: 5
  card6_title: "Wall St/Pier 11"
  # END generated by npm run preview:sync

  use_24_hour: true
  urgent_threshold: 10
  show_leave_in: false
