- keyname: use_24_hour
  field_type: boolean
  name: 24-hour clock
  group: Display
  optional: true
  default: true
- keyname: urgent_threshold
  field_type: number
  name: Highlight departures within (minutes)
  group: Display
  optional: true
  default: 5
  placeholder: 5
  help_text: 'Rows this close to your leave time are highlighted — drawn white on black, so they are what the eye lands on first. Counted after walk time is subtracted, so it is how long you have before you must leave, not how long until the train arrives. Lower it if most of the board ends up highlighted: once half the rows are marked, nothing is.

    '
- keyname: destination_scale
  field_type: select
  name: Destination text size
  group: Display
  optional: true
  options:
  - 0.8
  - 0.9
  - '1'
  - 1.1
  - 1.2
  default: '1'
  help_text: 'How large the "to" station is drawn on each row. Smaller shows more of a long name before it clips — useful at a station like Times Square, where two direction columns leave a destination little room. Larger reads better from across a room. The route badge and the clock keep their size either way.

    '
- keyname: show_leave_in
  field_type: boolean
  name: Show "leave in N minutes"
  group: Display
  optional: true
  default: false
  help_text: 'Off by default. The panel refreshes on an interval, so a countdown can be stale by up to that interval while a clock time never is. The walk-time filter applies either way.

    '
name: NYC Transit Board
