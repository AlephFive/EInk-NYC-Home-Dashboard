  - keyname: urgent_threshold
    field_type: number
    name: Highlight departures within (minutes)
    description: How soon counts as urgent, after walk time
    group: Display
    optional: true
    default: 5
    placeholder: 5
    help_text: >
      Rows this close to your leave time are highlighted — drawn white on
      black, so they are what the eye lands on first. Counted after walk
      time is subtracted, so it is how long you have before you must leave,
      not how long until the train arrives. Lower it if most of the board
      ends up highlighted: once half the rows are marked, nothing is.

