---
# Uploaded to TRMNL by `trmnlp push`. The local-only knobs (test values, time
# zone) live in ../.trmnlp.yml instead.
#
# Replace REPLACE_ME with the deployed Worker's hostname — or run
# `npm run configure <host>` from trmnl-recipe/, which does it everywhere.
# The plugin this project pushes to. Written by `trmnlp push` on the first
# push and kept here deliberately: without it every push CREATES A NEW
# PLUGIN rather than updating this one.
#
#   https://trmnl.com/plugin_settings/524413/edit
id: 524413

name: NYC Transit Board
description: NYC departures you can still catch

recipe_overview: >-
  A live departure board for New York City transit, filtered by how long it
  takes you to walk to the stop.

  Pick up to six stations across subway, Long Island Rail Road, Metro-North,
  MTA bus and NYC Ferry, and set a walk time for each. Departures you could not physically
  reach are hidden, so every row on the panel is a train or bus you can still
  catch if you leave now. That filter is the point: the MTA's own apps show you
  everything, including the train pulling out as you read about it.

  Stations are searched by name rather than by stop ID. Subway complexes that
  span several platforms are offered as one choice, so picking Times Square
  shows every line that serves it instead of silently showing one platform
  group. Bus stops are checked against the MTA's current stop list, because
  retired stop IDs stay in the published data and would otherwise produce a
  card that never loads.

  The board shows departure clock times rather than a countdown. A panel
  refreshes on an interval, so "leaves in 6 minutes" is stale the moment it is
  drawn, while "16:42" stays true. Departures close enough that you should
  already be leaving are highlighted, drawn white on black so they are what the
  eye lands on first.

  A card can be narrowed to the routes you actually ride, and to one direction.
  Most people only travel one way from a given stop, and giving those rows the
  whole card is worth more than listing trains you will never take.

  Data comes from the MTA's own realtime feeds and nothing else. There is no
  fallback to a printed timetable: if a feed says nothing is coming, the card
  says so rather than guessing. A station whose feed fails shows that in its own
  card while the rest of the board keeps working.

  Layouts are provided for the full screen and for half and quarter mashup
  cells, each designed for the space it gets rather than scaled down.

# Up to three, for the plugin directory.
categories:
  - transit
  - productivity

strategy: polling
# GET, with the board in the query string.
#
# The board is a JSON POST body in `recipe/polling-body.json`, and the
# Worker reads it — that format removed the whole class of parsing bug the
# query string kept producing. The plugin cannot use it: `trmnlp push`
# uploads `polling_verb` but silently drops `polling_body` and
# `polling_headers`, so the server ends up POSTing an empty document and
# every card disappears. Verified by pushing and pulling back: the body
# round-trips to empty whether written as a block scalar or one line.
#
# Until that is fixed — by TRMNL's CLI, or by pasting the body into the
# web UI by hand — the query string is what actually reaches the panel.
polling_verb: POST
polling_url: https://trmnl-nyc-transit.spo2-spire-club.workers.dev/api/board
polling_headers: "content-type=application/json"
polling_body: |-
  {
    "cards": [
      {%- assign s1 = card1_station | split: "::" -%}
      {%- assign p1 = s1[0] | split: ":" -%}
      {%- assign i1 = p1[1] | split: "+" -%}
      {
        "station": {
          "type": {{ p1[0] | json }},
          "ids": [{%- for id in i1 -%}{{ id | json }}{%- unless forloop.last -%},{%- endunless -%}{%- endfor -%}]
        },
        "routes": {{ card1_routes | json }},
        "walk": {{ card1_walk | json }},
        "title": {{ card1_title | json }},
        "visible": {{ card1_visible | json }},
        "direction": {{ card1_direction | json }}
      },
      {%- assign s2 = card2_station | split: "::" -%}
      {%- assign p2 = s2[0] | split: ":" -%}
      {%- assign i2 = p2[1] | split: "+" -%}
      {
        "station": {
          "type": {{ p2[0] | json }},
          "ids": [{%- for id in i2 -%}{{ id | json }}{%- unless forloop.last -%},{%- endunless -%}{%- endfor -%}]
        },
        "routes": {{ card2_routes | json }},
        "walk": {{ card2_walk | json }},
        "title": {{ card2_title | json }},
        "visible": {{ card2_visible | json }},
        "direction": {{ card2_direction | json }}
      },
      {%- assign s3 = card3_station | split: "::" -%}
      {%- assign p3 = s3[0] | split: ":" -%}
      {%- assign i3 = p3[1] | split: "+" -%}
      {
        "station": {
          "type": {{ p3[0] | json }},
          "ids": [{%- for id in i3 -%}{{ id | json }}{%- unless forloop.last -%},{%- endunless -%}{%- endfor -%}]
        },
        "routes": {{ card3_routes | json }},
        "walk": {{ card3_walk | json }},
        "title": {{ card3_title | json }},
        "visible": {{ card3_visible | json }},
        "direction": {{ card3_direction | json }}
      },
      {%- assign s4 = card4_station | split: "::" -%}
      {%- assign p4 = s4[0] | split: ":" -%}
      {%- assign i4 = p4[1] | split: "+" -%}
      {
        "station": {
          "type": {{ p4[0] | json }},
          "ids": [{%- for id in i4 -%}{{ id | json }}{%- unless forloop.last -%},{%- endunless -%}{%- endfor -%}]
        },
        "routes": {{ card4_routes | json }},
        "walk": {{ card4_walk | json }},
        "title": {{ card4_title | json }},
        "visible": {{ card4_visible | json }},
        "direction": {{ card4_direction | json }}
      },
      {%- assign s5 = card5_station | split: "::" -%}
      {%- assign p5 = s5[0] | split: ":" -%}
      {%- assign i5 = p5[1] | split: "+" -%}
      {
        "station": {
          "type": {{ p5[0] | json }},
          "ids": [{%- for id in i5 -%}{{ id | json }}{%- unless forloop.last -%},{%- endunless -%}{%- endfor -%}]
        },
        "routes": {{ card5_routes | json }},
        "walk": {{ card5_walk | json }},
        "title": {{ card5_title | json }},
        "visible": {{ card5_visible | json }},
        "direction": {{ card5_direction | json }}
      },
      {%- assign s6 = card6_station | split: "::" -%}
      {%- assign p6 = s6[0] | split: ":" -%}
      {%- assign i6 = p6[1] | split: "+" -%}
      {
        "station": {
          "type": {{ p6[0] | json }},
          "ids": [{%- for id in i6 -%}{{ id | json }}{%- unless forloop.last -%},{%- endunless -%}{%- endfor -%}]
        },
        "routes": {{ card6_routes | json }},
        "walk": {{ card6_walk | json }},
        "title": {{ card6_title | json }},
        "visible": {{ card6_visible | json }},
        "direction": {{ card6_direction | json }}
      }
    ],
    "use24Hour": {{ use_24_hour | json }},
    "urgent": {{ urgent_threshold | json }},
    "destinationScale": {{ destination_scale | json }},
    "showLeaveIn": {{ show_leave_in | json }}
  }
refresh_interval: 900

# The panel is 1-bit; the board draws its own emphasis by inverting rows.
dark_mode: false
no_screen_padding: false

custom_fields:
  # Required for store submission: users need a way to reach the author. The
  # repo link rather than an email, since this is a public listing.
  - keyname: author_bio
    field_type: author_bio
    name: About
    description: >-
      Built by Shao-en Ma.
      <a href="https://github.com/AlephFive/EInk-NYC-Home-Dashboard/blob/main/docs/USER-GUIDE.md">Full
      guide</a> — filtering routes, picking a direction, splitting a
      station across two cards.
      <a href="https://github.com/AlephFive/EInk-NYC-Home-Dashboard">Source
      and issues</a>.

  - keyname: card1_visible
    field_type: boolean
    name: Show this card
    description: Untick to park a card without losing its settings
    group: Column 1 · Row 1
    optional: true
    default: true
    help_text: >-
      Untick to hide the card without losing its settings. Its column-mate
      then fills the column and shows about twice as many departures.

  - keyname: card1_station
    field_type: xhrSelectSearch
    name: Station or stop
    description: Type part of a name, then pick from the list
    group: Column 1 · Row 1
    optional: true
    endpoint: https://trmnl-nyc-transit.spo2-spire-club.workers.dev/api/stations?slot=1
    http_verb: GET
    help_text: >
      Stations that share a complex are listed once and show every platform.
      A bus corner is listed once and shows both directions.

  - keyname: card1_routes
    field_type: string
    name: Routes (optional)
    description: Leave blank for everything that calls here
    group: Column 1 · Row 1
    optional: true
    placeholder: 1,2,3
    help_text: >-
      Comma separated, named the way you would say them, and it works on
      every kind of stop — subway lines (1,2,3 or A,C,E or S), railroad
      branches (Hudson, Babylon), bus routes (M42, Q101) or a ferry route.
      Matching ignores case and accepts the start of a name, so "hud" finds
      the Hudson line. Asking for 7 includes the express 7, and S covers
      every shuttle. Most useful at a complex like Times Square, which
      carries twelve lines on one card: name a few and the rest are hidden.

  - keyname: card1_direction
    field_type: select
    name: Direction
    description: Leave blank to show both
    group: Column 1 · Row 1
    optional: true
    options:
      - "1"
      - "2"
    help_text: >-
      Blank shows both directions side by side. Pick one and it gets the
      whole card, which is worth doing when you only ever ride one way
      from this stop.

      On a railroad, 1 is towards the city and 2 is away from it — so at
      a terminal like Grand Central, 1 is empty, because nothing departs
      towards the city from there. On subway and bus, 1 and 2 are simply
      the card's left and right columns; the heading above each says
      where it goes, so pick one and check.

  - keyname: card1_walk
    field_type: number
    name: Walk time (minutes)
    description: How long it takes you to reach this stop
    group: Column 1 · Row 1
    optional: true
    default: 5
    placeholder: 5
    help_text: Departures you could not reach in this time are hidden.

  - keyname: card1_title
    field_type: string
    name: Card heading
    description: Leave blank to use the station's own name
    group: Column 1 · Row 1
    optional: true
    placeholder: Defaults to the station name
    help_text: Leave blank to use the station name.

  - keyname: card2_visible
    field_type: boolean
    name: Show this card
    description: Untick to park a card without losing its settings
