    name: Destination text size
    description: Smaller shows more of a long station name
    group: Display
    optional: true
    options:
      - 0.8
      - 0.9
      - "1"
      - 1.1
      - 1.2
    default: "1"
    help_text: >
      How large the "to" station is drawn on each row. Smaller shows more of
      a long name before it clips — useful at a station like Times Square,
      where two direction columns leave a destination little room. Larger
      reads better from across a room. The route badge and the clock keep
      their size either way.

  - keyname: show_leave_in
    field_type: boolean
    name: Show "leave in N minutes"
    description: Off by default, because a countdown goes stale
    group: Display
    optional: true
    default: false
    help_text: >
      Off by default. The panel refreshes on an interval, so a countdown can be
      stale by up to that interval while a clock time never is. The walk-time
      filter applies either way.

