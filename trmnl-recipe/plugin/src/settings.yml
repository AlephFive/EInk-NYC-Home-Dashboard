- keyname: author_bio
  field_type: author_bio
  name: About
  description: 'Built by Shao-en Ma. Source, issues and setup notes: <a href="https://github.com/AlephFive/EInk-NYC-Home-Dashboard">github.com/AlephFive/EInk-NYC-Home-Dashboard</a>'
- keyname: card1_visible
  field_type: boolean
  name: Show this card
  group: Column 1 · Row 1
  optional: true
  default: true
  help_text: Untick to hide the card without losing its settings. Its column-mate then fills the column and shows about twice as many departures.
- keyname: card1_station
  field_type: xhrSelectSearch
  name: Station or stop
  description: Type part of a name, then pick from the list
  group: Column 1 · Row 1
  optional: true
  endpoint: https://trmnl-nyc-transit.spo2-spire-club.workers.dev/api/stations?slot=1
  http_verb: GET
  help_text: 'Stations that share a complex are listed once and show every platform. A bus corner is listed once and shows both directions.

    '
- keyname: card1_routes
  field_type: string
  name: Routes (optional)
  description: Leave blank for everything that calls here
  group: Column 1 · Row 1
  optional: true
  placeholder: 123
  help_text: 'Comma separated, named the way you would say them, and it works on every kind of stop — subway lines (1,2,3 or A,C,E or S), railroad branches (Hudson, Babylon), bus routes (M42, Q101) or a ferry route. Matching ignores case and accepts the start of a name, so "hud" finds the Hudson line. Asking for 7 includes the express 7, and S covers every shuttle. Most useful at a complex like Times Square, which carries twelve lines on one card: name a few and the rest are hidden.'
- keyname: card1_direction
  field_type: select
  name: Direction
  description: Leave on Both unless you only ever travel one way
  group: Column 1 · Row 1
  optional: true
  options:
  - Both
  - '1'
  - '2'
  default: Both
  help_text: A card normally shows both directions side by side. Pick one and it gets the whole card, which is worth doing when you only ever ride one way from this stop. On a railroad, 1 is towards the city and 2 is away from it. On subway and bus the two are the card's left and right columns — the heading above each says where it goes.
- keyname: card1_walk
  field_type: number
  name: Walk time (minutes)
  group: Column 1 · Row 1
  optional: true
  default: 5
  placeholder: 5
  help_text: Departures you could not reach in this time are hidden.
- keyname: card1_title
  field_type: string
  name: Card heading
  group: Column 1 · Row 1
  optional: true
  placeholder: Defaults to the station name
  help_text: Leave blank to use the station name.
