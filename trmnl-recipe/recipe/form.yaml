# TRMNL recipe form — NYC transit board
#
# Paste the body of this file into the plugin's "Custom Fields" box, after
# replacing REPLACE_ME with the deployed Worker's hostname.
#
# Layout is a fixed 3x2 grid: three columns, at most two cards each. Three is
# the last column count at which a destination stays readable — at four, a
# subway destination gets about one character. Slots map to the grid in order:
#
#   Card 1 | Card 3 | Card 5      (top row)
#   Card 2 | Card 4 | Card 6      (bottom row)
#
# A slot left Off is omitted and its column-mate fills the column, doubling
# that card's rows.

- keyname: card1_type
  field_type: select
  name: Transit type
  description: Left column, top
  group: Card 1
  optional: true
  default: 'off'
  help_text: Leave off to hide this card. Its column-mate then fills the column.
  options:
    - 'Off': 'off'
    - Subway: subway
    - LIRR: lirr
    - Metro-North: mtn
    - Bus: bus

- keyname: card1_station
  field_type: xhrSelectSearch
  name: Station or stop
  description: Type part of a name, then pick from the list
  group: Card 1
  optional: true
  depends_on: card1_type
  endpoint: https://REPLACE_ME.workers.dev/api/stations/{{card1_type}}
  http_verb: POST
  help_text: >
    Stations that share a complex are listed once and show every platform.
    A bus corner is listed once and shows both directions.

- keyname: card1_routes
  field_type: string
  name: Only these lines
  group: Card 1
  optional: true
  placeholder: All lines at this station
  help_text: >
    Comma-separated, e.g. "1,2,3". Leave blank for every line. Use the letter
    or number you read on the train: S covers all three shuttles, and asking
    for 7 includes the 7 express. Put the same station on two cards with
    different lines to split a big complex.

- keyname: card1_walk
  field_type: number
  name: Walk time (minutes)
  group: Card 1
  optional: true
  default: 5
  placeholder: 5
  help_text: Departures you could not reach in this time are hidden.

- keyname: card1_title
  field_type: string
  name: Card heading
  group: Card 1
  optional: true
  placeholder: Defaults to the station name
  help_text: Leave blank to use the station name.

